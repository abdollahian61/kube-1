apiVersion: v1
kind: Pod
metadata:
  name: nfs-test
  namespace: default
spec:
  containers:
    - name: test
      image: repository.eways.co/docker-local/library/busybox:1.36
      command: ["sh", "-c", "echo Eways-NFS > /data/test.txt; cat /data/test.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nfs-test-pvc
