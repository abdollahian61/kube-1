# Eways Traefik Helm chart 42.1.3 (app v3.7.16)
# Config validated with 'helm lint' on the server; runtime deployment unverified.
image:
  registry: repository.eways.co
  repository: docker-k8s/traefik
  tag: v3.7.16
  pullPolicy: IfNotPresent

deployment:
  replicas: 1

service:
  enabled: true
  spec:
    type: NodePort

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    nodePort: 30080
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    nodePort: 30443
    http:
      tls:
        enabled: true

providers:
  kubernetesIngress:
    enabled: true
  kubernetesCRD:
    enabled: true

ingressRoute:
  dashboard:
    enabled: false

log:
  level: INFO
accessLog: {}
